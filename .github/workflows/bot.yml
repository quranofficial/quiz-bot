name: Telegram Quiz Bot

# هەر ٥ خولەک جارێک دانیشتێکی نوێ دەست پێدەکات؛ بۆت خۆی ٤ خولەک بەردەوام
# پۆڵینگ دەکات، پاشان بە ساغلامی دادەوەستێت — بەمە بۆت ٢٤ کاتژمێر چالاک دەمێنێتەوە.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# تەنها یەک دانیشت لە هەمان کاتدا — بۆ ڕێگریکردن لە ململانێی getUpdates
concurrency:
  group: telegram-quiz-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          POLL_SECONDS: "240"
        run: python bot.py

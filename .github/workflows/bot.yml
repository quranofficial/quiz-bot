name: Telegram Quiz Bot

# چۆنیەتی کارکردنی ٢٤/٧:
# • هەر ٥ خولەک جارێک cron دانیشتێک دەست پێدەکات، بەڵام بەهۆی concurrency ـەوە
#   هەموو کاتێک تەنها یەک دانیشت کاردەکات و یەک دانیشتیش چاوەڕوان (pending) هەڵدەگیرێت.
# • بۆت هەر دانیشتێک ٥ کاتژمێر و ٥٠ خولەک (٢١٠٠٠ چرکە) بەبێ پشوو پۆڵینگ دەکات.
# • کاتێک دانیشتەکە تەواو دەبێت، دانیشتە چاوەڕوانەکە بە چەند چرکەیەک دەست پێدەکاتەوە —
#   بۆیە بۆت بە شێوەیەکی بەردەوام (٢٤ کاتژمێر / ٧ ڕۆژ) ئۆنلاین دەمێنێتەوە
#   و پشووەکە تەنها چەند چرکەیەکە (~٤ جار لە ڕۆژێکدا).
# • پەیامەکانی نێوان گۆڕینەکە بە تێلێگرام خەزن دەکرێن و بە خۆکاری دەگەن — هیچ پەیامێک لەدەست ناچێت.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# تەنها یەک دانیشت لە هەمان کاتدا — بۆ ڕێگریکردن لە ململانێی getUpdates
concurrency:
  group: telegram-quiz-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # سنووری GitHub: زۆرترین ٦ کاتژمێر بۆ هەر دانیشتێک — ئێمە ٣٥٥ خولەک داناوە
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (٥ کاتژمێر و ٥٠ خولەک)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          POLL_SECONDS: "21000"
          TZ: "Asia/Baghdad"
        run: python bot.py
